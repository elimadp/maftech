name: probe-sources
on:
  push:
    branches: [probe-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: python probe/probe.py
